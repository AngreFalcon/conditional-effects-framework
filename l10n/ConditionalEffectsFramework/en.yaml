page_name: Conditional Effects Framework
page_description: Conditional Effects Framework is a mod that allows VFX to be dynamically applied to and removed from NPCs and creatures, including the player character, based on configuration files installed by the user.

toggle_settings_group_name: Effect Toggles
toggle_settings_group_desc: These settings allow you to toggle on/off effects in-game, and are organized by the file they originate from.

general_settings_group_name: General Settings
general_settings_group_desc: General settings related to Conditional Effects Framework.

config_toggle_name: "Config Toggle - "
config_toggle_desc: "Toggle configs from file: "

cef_enable_name: Framework Toggle
cef_enable_desc: Enables or disables Conditional Effects Framework.
cef_enable_enabled: CEF Enabled
cef_enable_disabled: CEF Disabled

cef_lite_mode_name: Lite mode
cef_lite_mode_desc: If enabled, effects will only be checked when an actor loads. This means, once an effect is applied, it won't be removed until the actor is unloaded. This also means if an effect's conditions fail, that effect won't be re-evaluated until the next time the actor loads. Enabling this may drastically increase performance.
cef_lite_mode_enabled: Lite Mode Enabled
cef_lite_mode_disabled: Lite Mode Disabled

tick_rate_name: Tick Rate
tick_rate_desc: The tick rate in seconds for Conditional Effects Framework. Lower values may affect performance in NPC-heavy areas.

cef_enable_menu_updates_name: Menu Updates Toggle
cef_enable_menu_updates_desc: Enables or disables updates for Conditional Effects Framework while menus are open.
cef_enable_menu_updates_enabled: Menu Updates Enabled
cef_enable_menu_updates_disabled: Menu Updates Disabled

menu_tick_rate_name: Menu Tick Rate
menu_tick_rate_desc: The tick rate in seconds for Conditional Effects Framework while a menu is open. Lower values may affect performance in NPC-heavy areas.